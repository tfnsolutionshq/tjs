name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tjs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Upload Vite build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build/
          retention-days: 1

  deploy:
    name: Deploy to DreamHost
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Rsync built assets to server
        env:
          SSH_HOST: ${{ secrets.DREAMHOST_HOST }}
          SSH_USER: ${{ secrets.DREAMHOST_USER }}
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          APP_DIR: ${{ secrets.DREAMHOST_APP_DIR }}
        run: |
          set -euo pipefail
          APP_DIR="${APP_DIR:-tjs.tfnsolutions.us}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "mkdir -p ${APP_DIR}/public/build"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            public/build/ \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/public/build/"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DREAMHOST_HOST }}
          username: ${{ secrets.DREAMHOST_USER }}
          key: ${{ secrets.DREAMHOST_SSH_KEY }}
          script_stop: true
          script: |
            export TJS_APP_DIR="${{ secrets.DREAMHOST_APP_DIR }}"
            APP_DIR="${TJS_APP_DIR:-tjs.tfnsolutions.us}"
            [[ "$APP_DIR" != /* ]] && APP_DIR="$HOME/$APP_DIR"
            bash "$APP_DIR/deploy/deploy.sh"
